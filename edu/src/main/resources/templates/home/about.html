<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: layout(~{::title}, ~{::section})}">
  <head>
    <title th:text="#{menu.about}">Giới thiệu</title>
  </head>
  <body>
    <section>
      <div class="card shadow-sm border-0 p-4">
        <h3 class="fw-bold text-primary mb-3" th:text="${aboutTitle}">Giới thiệu</h3>
        <p class="lead" th:text="${mission}">Sứ mệnh</p>
        <hr />
        <h5>Quy trình đặt lịch tư vấn 3 bước đơn giản:</h5>
        <ol class="mt-2">
          <li>Tìm kiếm và lựa chọn <strong>Gói tư vấn</strong> phù hợp với nhu cầu học tập/nghề nghiệp.</li>
          <li>Điền thông tin vào <strong>Form đặt lịch</strong> và chọn khung giờ mong muốn.</li>
          <li>Nhận xác nhận và tham gia buổi tư vấn 1-1 cùng Chuyên viên.</li>
        </ol>
      </div>
    </section>
