<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:replace="${title}">CareerPath Portal</title>
    <!-- Tích hợp Bootstrap 5 để giao diện chuẩn đẹp -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background-color: #f8f9fa;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .hero-header {
        background: linear-gradient(135deg, #0d6efd, #0dcaf0);
        color: white;
        padding: 25px 0;
      }
      main {
        flex: 1;
      }
      footer {
        background-color: #212529;
        color: #adb5bd;
        padding: 20px 0;
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <!-- 1. HEADER DÙNG CHUNG -->
    <header class="hero-header shadow-sm">
      <div class="container d-flex justify-content-between align-items-center">
        <div>
          <h2 class="mb-1 fw-bold" th:text="#{app.title}">CareerPath Booking Portal</h2>
          <p class="mb-0 opacity-75" th:text="#{app.subtitle}">Hệ thống đặt lịch tư vấn</p>
        </div>
        <!-- Nút chuyển đổi Đa ngôn ngữ Việt - Anh -->
        <div>
          <a href="?lang=vi" class="btn btn-sm btn-light fw-bold me-1" th:text="#{menu.lang.vi}">Tiếng Việt</a>
          <a href="?lang=en" class="btn btn-sm btn-outline-light fw-bold" th:text="#{menu.lang.en}">English</a>
        </div>
      </div>
    </header>

    <!-- 2. MENU ĐIỀU HƯỚNG DÙNG CHUNG -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
      <div class="container">
        <div class="navbar-nav me-auto">
          <a class="nav-link" th:href="@{/home/index}" th:text="#{menu.home}">Trang chủ</a>
          <a class="nav-link" th:href="@{/consultation/list}" th:text="#{menu.packages}">Gói tư vấn</a>
          <a class="nav-link" th:href="@{/booking/form}" th:text="#{menu.booking}">Đặt lịch ngay</a>
          <a class="nav-link" th:href="@{/booking/list}" th:text="#{menu.bookingList}">Lịch đã đặt</a>
          <a class="nav-link" th:href="@{/home/about}" th:text="#{menu.about}">Giới thiệu</a>
          <a class="nav-link" th:href="@{/home/help}" th:text="#{menu.help}">Trợ giúp</a>
        </div>
        <span class="navbar-text text-warning small">SOF3022 - Spring Boot MVC</span>
      </div>
    </nav>

    <!-- 3. CONTENT (NỘI DUNG RIÊNG CỦA TỪNG TRANG SẼ ĐƯỢC NHÚNG VÀO ĐÂY) -->
    <main class="container my-4">
      <div th:replace="${content}"></div>
    </main>

    <!-- 4. FOOTER DÙNG CHUNG -->
    <footer class="text-center">
      <div class="container">
        <span th:text="#{footer.copyright}">© 2026 FPT Polytechnic</span>
      </div>
    </footer>
  </body>
</html>
