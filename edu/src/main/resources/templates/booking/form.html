<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: layout(~{::title}, ~{::section})}">
  <head>
    <title th:text="#{booking.form.title}">Đặt lịch tư vấn</title>
  </head>
  <body>
    <section>
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm border-0 p-4 bg-white">
            <h3 class="fw-bold text-primary mb-2" th:text="#{booking.form.title}">Form Đặt Lịch Tư Vấn</h3>
            <p class="text-muted small mb-4">Vui lòng điền đầy đủ các thông tin có dấu (<span class="text-danger">*</span>) để xác nhận lịch hẹn với chuyên viên.</p>

            <!-- FORM ĐẶT LỊCH: Dùng th:object, th:field và enctype="multipart/form-data" -->
            <form th:action="@{/booking/save}" th:object="${bookingForm}" method="post" enctype="multipart/form-data" novalidate>
              <!-- Thông báo lỗi tổng quát ở đầu form (Yêu cầu bắt buộc của MVC-06) -->
              <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger shadow-sm">
                <strong th:text="#{booking.error.global}">Vui lòng kiểm tra lại thông tin!</strong>
                <div class="small mt-1">Các thông tin bạn đã nhập vẫn được giữ nguyên bên dưới.</div>
              </div>

              <div class="row g-3">
                <!-- 1. Họ tên người đặt -->
                <div class="col-md-6">
                  <label class="form-label fw-bold">Họ và tên sinh viên <span class="text-danger">*</span></label>
                  <input type="text" th:field="*{fullName}" class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" placeholder="VD: Nguyễn Văn A" />
                  <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <!-- 2. Số điện thoại -->
                <div class="col-md-6">
                  <label class="form-label fw-bold">Số điện thoại <span class="text-danger">*</span></label>
                  <input type="text" th:field="*{phone}" class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" placeholder="VD: 0901234567" />
                  <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <!-- 3. Email liên hệ -->
                <div class="col-md-12">
                  <label class="form-label fw-bold">Email liên hệ <span class="text-danger">*</span></label>
                  <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="VD: sinhvien@fpt.edu.vn" />
                  <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <!-- 4. Chọn Gói tư vấn -->
                <div class="col-md-6">
                  <label class="form-label fw-bold">Gói tư vấn <span class="text-danger">*</span></label>
                  <select th:field="*{consultationPackageId}" class="form-select" th:classappend="${#fields.hasErrors('consultationPackageId')} ? 'is-invalid' : ''">
                    <option value="">-- Chọn gói tư vấn --</option>
                    <option th:each="p : ${packages}" th:value="${p.id}" th:text="|${p.name} (${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} đ)|"></option>
                  </select>
                  <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('consultationPackageId')}" th:errors="*{consultationPackageId}"></div>
                </div>

                <!-- 5. Chọn Chuyên viên -->
                <div class="col-md-6">
                  <label class="form-label fw-bold">Chuyên viên tư vấn <span class="text-danger">*</span></label>
                  <select th:field="*{consultantId}" class="form-select" th:classappend="${#fields.hasErrors('consultantId')} ? 'is-invalid' : ''">
                    <option value="">-- Chọn chuyên viên --</option>
                    <option th:each="c : ${consultants}" th:value="${c.id}" th:text="|${c.fullName} - ${c.specialty}|"></option>
                  </select>
                  <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('consultantId')}" th:errors="*{consultantId}"></div>
                </div>

                <!-- 6. Ngày mong muốn -->
                <div class="col-md-6">
                  <label class="form-label fw-bold">Ngày tư vấn mong muốn <span class="text-danger">*</span></label>
                  <input type="date" th:field="*{preferredDate}" class="form-control" th:classappend="${#fields.hasErrors('preferredDate')} ? 'is-invalid' : ''" />
                  <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('preferredDate')}" th:errors="*{preferredDate}"></div>
                </div>

                <!-- 7. Khung giờ -->
                <div class="col-md-6">
                  <label class="form-label fw-bold">Khung giờ <span class="text-danger">*</span></label>
                  <select th:field="*{preferredTime}" class="form-select" th:classappend="${#fields.hasErrors('preferredTime')} ? 'is-invalid' : ''">
                    <option value="">-- Chọn khung giờ --</option>
                    <option th:each="slot : ${timeSlots}" th:value="${slot}" th:text="${slot}"></option>
                  </select>
                  <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('preferredTime')}" th:errors="*{preferredTime}"></div>
                </div>

                <!-- 8. Upload tài liệu/minh chứng (MultipartFile) -->
                <div class="col-md-12">
                  <label class="form-label fw-bold">Tài liệu đính kèm / CV (Nếu có)</label>
                  <input type="file" th:field="*{attachment}" class="form-control" />
                  <small class="text-muted">Hỗ trợ đính kèm CV, bảng điểm hoặc câu hỏi chuẩn bị trước (.pdf, .docx, .png, .jpg).</small>
                </div>

                <!-- 9. Ghi chú -->
                <div class="col-md-12">
                  <label class="form-label fw-bold">Ghi chú / Câu hỏi gửi trước cho chuyên viên</label>
                  <textarea th:field="*{note}" rows="3" class="form-control" th:classappend="${#fields.hasErrors('note')} ? 'is-invalid' : ''" placeholder="Nhập nội dung bạn muốn chuyên viên tập trung giải đáp (tối đa 255 ký tự)..."></textarea>
                  <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></div>
                </div>
              </div>

              <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                <a th:href="@{/consultation/list}" class="btn btn-outline-secondary">Hủy / Quay lại</a>
                <button type="submit" class="btn btn-primary px-4 fw-bold" th:text="#{booking.btn.submit}">Xác nhận đặt lịch</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
