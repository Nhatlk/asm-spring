<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main-layout :: layout(~{::title}, ~{::section})}">
  <head>
    <title th:text="#{booking.list.title}">Lịch đã đặt</title>
  </head>
  <body>
    <section>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold text-primary mb-0" th:text="#{booking.list.title}">Danh Sách Lịch Tư Vấn Đã Đặt</h3>
        <a th:href="@{/booking/form}" class="btn btn-primary">+ Đặt lịch mới</a>
      </div>

      <!-- Thông báo thành công sau khi redirect từ Form -->
      <div th:if="${successMessage != null}" class="alert alert-success shadow-sm">
        <strong th:text="${successMessage}"></strong>
      </div>

      <div th:if="${#lists.isEmpty(bookings)}" class="alert alert-info text-center p-4" th:text="#{booking.empty}">Chưa có lịch đặt nào.</div>

      <div class="card shadow-sm border-0" th:unless="${#lists.isEmpty(bookings)}">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>Mã</th>
                <th>Sinh viên</th>
                <th>Gói tư vấn</th>
                <th>Chuyên viên</th>
                <th>Ngày & Khung giờ</th>
                <th>Đính kèm</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="b : ${bookings}">
                <td class="fw-bold" th:text="|#BK0${b.id}|"></td>
                <td>
                  <div class="fw-bold" th:text="${b.fullName}"></div>
                  <small class="text-muted" th:text="|${b.phone} - ${b.email}|"></small>
                </td>
                <td>
                  <span class="fw-bold text-primary" th:text="${b.consultationPackage != null ? b.consultationPackage.name : 'N/A'}"></span>
                  <div class="small text-danger fw-bold" th:if="${b.consultationPackage != null}" th:text="${#numbers.formatDecimal(b.consultationPackage.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                </td>
                <td th:text="${b.consultant != null ? b.consultant.fullName : 'N/A'}"></td>
                <td>
                  <span class="badge bg-info text-dark" th:text="${b.preferredDate}"></span>
                  <div class="small fw-bold mt-1" th:text="${b.preferredTime}"></div>
                </td>
                <td>
                  <span th:if="${b.attachmentFileName != null}" class="badge bg-light text-dark border" th:text="${b.attachmentFileName}"></span>
                  <span th:if="${b.attachmentFileName == null}" class="text-muted small">Không có</span>
                </td>
                <td>
                  <span class="badge" th:classappend="${b.status == 'CONFIRMED'} ? 'bg-success' : 'bg-warning text-dark'" th:text="${b.status}"></span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </body>
</html>
